    <circle cx="110" cy="155" r="1.5" fill="rgba(240,197,240,0.2)" />
    <circle cx="105" cy="160" r="1.2" fill="rgba(240,187,214,0.18)" />
    <circle cx="115" cy="158" r="1.8" fill="rgba(243,200,243,0.22)" />
    <circle cx="95" cy="108" r="1.5" fill="rgba(239,183,211,0.2)" />
    <circle cx="125" cy="108" r="1.5" fill="rgba(239,183,211,0.2)" />
    <circle cx="100" cy="168" r="1" fill="rgba(241,191,241,0.15)" />
    <circle cx="120" cy="166" r="1.2" fill="rgba(240,187,214,0.15)" />

    <!-- Feet -->
    <ellipse cx="96" cy="182" rx="9" ry="5" fill="rgba(178,132,224,0.7)" />
    <ellipse cx="124" cy="182" rx="9" ry="5" fill="rgba(178,132,224,0.7)" />

