    <circle cx="85" cy="138" r="2" fill="rgba(235,162,235,0.3)" />
    <circle cx="75" cy="142" r="1.5" fill="rgba(238,179,209,0.2)" />
    <circle cx="88" cy="122" r="1.5" fill="rgba(241,191,241,0.2)" />
