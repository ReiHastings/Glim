    <ellipse cx="135" cy="103" rx="6" ry="3" fill="rgba(226,140,183,0.3)" />

    <!-- Left antenna -->
    <path d="M98,75 Q92,55 88,42" stroke="rgba(178,128,228,0.6)"
      stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="88" cy="42" r="6" fill="rgba(238,159,238,0.85)" />
    <circle cx="88" cy="42" r="9" fill="rgba(237,170,237,0.15)" />

    <!-- Right antenna -->
