<svg viewBox="-15 -10 250 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyG" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="rgba(209,179,238,0.95)" />
      <stop offset="50%" stop-color="rgba(165,112,219,0.8)" />
      <stop offset="100%" stop-color="rgba(122,55,189,0.6)" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="rgba(229,210,248,0.5)" />
      <stop offset="100%" stop-color="rgba(203,170,237,0)" />
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="55%" r="30%">
      <stop offset="0%" stop-color="rgba(241,207,241,0.6)" />
      <stop offset="100%" stop-color="rgba(226,156,226,0)" />
    </radialGradient>
    <radialGradient id="spec" cx="38%" cy="30%" r="22%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feFlood flood-color="rgba(165,107,223,0.45)" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

