    <ellipse cx="168" cy="125" rx="35" ry="22" fill="url(#spec)" transform="rotate(10 168 125)" opacity="0.3" />
    <circle cx="180" cy="120" r="2.5" fill="rgba(237,170,237,0.4)" />
    <circle cx="185" cy="127" r="1.8" fill="rgba(235,162,198,0.3)" />
    <circle cx="175" cy="130" r="2" fill="rgba(232,149,232,0.35)" />
    <circle cx="170" cy="118" r="3" fill="rgba(237,170,204,0.25)" />
    <circle cx="190" cy="124" r="1.5" fill="rgba(238,179,238,0.3)" />

    <!-- Body -->
