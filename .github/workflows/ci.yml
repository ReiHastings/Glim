# -----------------------------------------------------------------------------
# Title:       ci.yml
# Project:     Glim
# Author:      Reina Hastings (reinahastings13@gmail.com)
# Created:     2026-09-20
# Purpose:     Checks every pull request and every push to main: install from
#              the lockfile, lint, run the full test matrix, and produce the
#              native web bundle. No deploy, no secrets. The job name "check"
#              is a contract: any branch rule that requires it matches by name.
#
#              Replaces deploy.yml (2026-03-27 to 2026-09-20), which published
#              the PWA to GitHub Pages. Glim now ships as the iOS app via
#              TestFlight; releases are archived from Xcode, not from CI.
#
#              npm ci runs in client/, where client/.npmrc (legacy-peer-deps)
#              applies. The VITE_FIREBASE_* values below are dummies: a Vite
#              build only substitutes the strings and never initialises
#              Firebase, so they verify nothing; they exist so a bundle built
#              here can never sign in anywhere.
# -----------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Test (full matrix)
        run: npm run test:all
        working-directory: client

      - name: Build (native web bundle)
        run: npm run build:ios
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: ci-dummy
